services:
  ml-lab:
    build: .
    env_file: ${ENV_FILE:-.env}
    # Keep the process non-root while allowing the host deploy user to back up storage.
    user: "10001:1000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
